<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NB Teams Rooms Signage</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .slideshow {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="slideshow" id="slideshow"></div>

  <script>
    // Lee el parámetro ?Room=Sala1 o ?Room=Sala2
    const params = new URLSearchParams(window.location.search);
    const roomSeleccionada = params.get("Room");

    // Configuración por sala
    const rooms = {
      "Sala1": [
        "sala1-1.jpg",
        "sala1-2.jpg",
        "sala1-3.jpg"
      ],
      "Sala2": [
        "sala2-1.jpg",
        "sala2-2.jpg",
        "sala2-3.jpg"
      ]
    };

    // Room por defecto
    const roomDefault = "Sala1";

    const imagenes = rooms[roomSeleccionada] || rooms[roomDefault];

    const slideshow = document.getElementById("slideshow");

    // Crear imágenes
    imagenes.forEach((src, index) => {
      const img = document.createElement("img");
      img.src = src;
      img.alt = "Digital Signage";
      img.className = "slide" + (index === 0 ? " active" : "");
      slideshow.appendChild(img);
    });

    const slides = document.querySelectorAll(".slide");
    let current = 0;

    // Si solo hay una imagen, no rota
    if (slides.length > 1) {
      setInterval(() => {
        slides[current].classList.remove("active");
        current = (current + 1) % slides.length;
        slides[current].classList.add("active");
      }, 8000);
    }
  </script>
</body>
</html>
